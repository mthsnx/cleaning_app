<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Task Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h2>Add Task</h2>
  <div class="form-row">
    <input id="title" placeholder="Title" />
    <select id="category" placeholder="Category" />
    <option value="rydde">Rydde</option>
    <option value="støvsuge">Støvsuge</option>
    <option value="vask">Vask</option>
    <option value="vaskemaskin">Vaskemaskin</option>
    <option value="tørketrommel">Tørketrommel</option>
    <option value="vaske">Vaskeservice</option>
  
  </select>
  </div>
  <div class="form-row">
    <input id="points" type="number" placeholder="Points" />
    <select id="assignedName" placeholder="Assign to (name)">
    <option value="ingdal">ingdal</option>
    <option value="markus">markus</option>
    <option value="mathias">mathias</option>
    <option value="sindre">sindre</option>
    <option value="theo">theo</option>
  </select>
  </div>
  <div class="form-row">
    <button id="addBtn" onclick="addTask()">Add</button>
  </div>

  <h2>Tasks</h2>
  <div id="tasks" class="tasks-grid"></div>


<script>
async function loadTasks() {
  const res = await fetch('/api/tasks');
  const tasks = await res.json();
  const box = document.getElementById('tasks');
  box.innerHTML = '';

  tasks.forEach(t => {
    const div = document.createElement('div');
    div.className = 'task';
    div.dataset.id = t.idTasks;

    const assigned = t.AssignedName ?
      `<div class="assigned">Assigned to: <strong>${t.AssignedName}</strong></div>` :
      `<div class="assigned">Unassigned</div>`;

    const avatar = t.AssignedAvatar ? `<img src="${t.AssignedAvatar}" alt="avatar" class="avatar"/>` : '';

    div.innerHTML = `
      <div class="task-main">
        <div class="task-info">
          <div class="task-title">${escapeHtml(t.Title)}</div>
          <div class="task-meta">${escapeHtml(t.Category)} · ${t.Points || 0} pts</div>
          ${assigned}
        </div>
        <div class="task-actions">
          ${avatar}
          <button class="done-btn">Done</button>
          <button class="edit-btn">Edit</button>
          <button class="delete-btn">Delete</button>
        </div>
      </div>
    `;

    div.querySelector('.done-btn').addEventListener('click', () => markDone(t.idTasks, div));
    div.querySelector('.edit-btn').addEventListener('click', () => editTask(t, div));
    div.querySelector('.delete-btn').addEventListener('click', () => deleteTask(t.idTasks, div));

    box.appendChild(div);
  });

}

function escapeHtml(str){
  if (!str && str !== 0) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

async function addTask() {
  const title = document.getElementById('title').value;
  const category = document.getElementById('category').value;
  const points = parseInt(document.getElementById('points').value || 0, 10);
  const assignedName = document.getElementById('assignedName').value;

  const res = await fetch('/api/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, category, points, assignedName })
  });

  if (!res.ok) {
    alert('Failed to add task');
    return;
  }

  await loadTasks();


  document.getElementById('title').value = '';
  document.getElementById('category').value = '';
  document.getElementById('points').value = '';
  document.getElementById('assignedName').value = '';
}

async function markDone(id, element) {
  const res = await fetch(`/api/tasks/${id}/done`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userId: 1 })
  });

  if (!res.ok) {
    alert('Failed to mark task done');
    return;
  }

  //trenger ikke refreshe hele listen, fjerner bare elementet
  if (element && element.parentNode) element.parentNode.removeChild(element);

  showToast('Task completed');

}

function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = 'show';
  setTimeout(()=> t.className = t.className.replace('show',''), 2000);
}

loadTasks();

async function deleteTask(id, element){
  if(!confirm('Delete this task?')) return;
  const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
  if(!res.ok){ alert('Failed to delete task'); return; }
  if (element && element.parentNode) element.parentNode.removeChild(element);
  showToast('Task deleted');
}

async function editTask(task, element){
  // basic prompt-based edit UI
  const title = prompt('Title', task.Title) || task.Title;
  const category = prompt('Category', task.Category) || task.Category;
  const pointsStr = prompt('Points', task.Points || 0);
  const points = parseInt(pointsStr,10) || 0;
  const assignedName = prompt('Assign to (name)', task.AssignedName || '');

  const res = await fetch(`/api/tasks/${task.idTasks}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, category, points, assignedName })
  });

  if(!res.ok){ alert('Failed to update task'); return; }
  showToast('Task updated');
  await loadTasks();
}
</script>
</body>
</html>
