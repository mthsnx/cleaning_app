<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Task Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>cleaning app</h1>
    </header>

    <main>

        <!-- MEMBERS -->
        <section class="card">
            <h2>Members</h2>
            <div id="membersList" class="grid"></div>

            <h3>Add Member</h3>
            <form id="addMemberForm">
                <input type="text" name="name" placeholder="Name" required>
                <input type="text" name="avatar_url" placeholder="Avatar URL (optional)">
                <button type="submit">Add Member</button>
            </form>
        </section>

        <!-- TASKS -->
        <section class="card">
            <h2>Tasks</h2>
            <table id="tasksTable">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <!-- LOGS -->
        <section class="card">
            <h2>Logs</h2>
            <table id="logsTable">
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Task</th>
                        <th>Points</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <h3>Add Log Entry</h3>
            <form id="addLogForm">

                <select name="user_id" id="memberSelect" required>
                    <option value="">Select Member</option>
                </select>

                <select name="task_id" id="taskSelect" required>
                    <option value="">Select Task</option>
                </select>

                <input type="datetime-local" name="datetime" required>

                <button type="submit">Add Log</button>
            </form>
        </section>

    </main>

<script>
/* ==========================
   LOAD MEMBERS
========================== */
function loadMembers() {
    fetch("/members")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("membersList");
            container.innerHTML = "";
            data.forEach(m => {
                container.innerHTML += `
                    <div class="member">
                        <img src="${m.Avatar_url || 'https://via.placeholder.com/80'}">
                        <div>
                            <strong>${m.Name}</strong><br>
                            <span>${m.points} pts</span>
                        </div>
                    </div>
                `;
            });
        });
}

/* ==========================
   POPULATE MEMBER DROPDOWN
========================== */
function loadMemberDropdown() {
    fetch("/members")
        .then(res => res.json())
        .then(data => {
            const select = document.getElementById("memberSelect");
            select.innerHTML = `<option value="">Select Member</option>`;
            data.forEach(m => {
                select.innerHTML += `
                    <option value="${m.idmember}">${m.Name} (${m.points} pts)</option>
                `;
            });
        });
}

/* ==========================
   LOAD TASKS
========================== */
function loadTasks() {
    fetch("/tasks")
        .then(res => res.json())
        .then(data => {
            const table = document.querySelector("#tasksTable tbody");
            table.innerHTML = "";
            data.forEach(t => {
                table.innerHTML += `
                    <tr>
                        <td>${t.Title}</td>
                        <td>${t.Category}</td>
                        <td>${t.Points}</td>
                    </tr>`;
            });
        });
}

/* ==========================
   POPULATE TASK DROPDOWN
========================== */
function loadTaskDropdown() {
    fetch("/tasks")
        .then(res => res.json())
        .then(data => {
            const select = document.getElementById("taskSelect");
            select.innerHTML = `<option value="">Select Task</option>`;
            data.forEach(t => {
                select.innerHTML += `
                    <option value="${t.idTasks}">${t.Title} (${t.Points} pts)</option>
                `;
            });
        });
}

/* ==========================
   LOAD LOGS
========================== */
function loadLogs() {
    fetch("/logs")
        .then(res => res.json())
        .then(data => {
            const table = document.querySelector("#logsTable tbody");
            table.innerHTML = "";
            data.forEach(l => {
                table.innerHTML += `
                    <tr>
                        <td>
                            <img src="${l.MemberAvatar || 'https://via.placeholder.com/40'}" class="avatar-sm">
                            ${l.MemberName}
                        </td>
                        <td>${l.TaskTitle}</td>
                        <td>${l.TaskPoints}</td>
                        <td>${l.Date_Time}</td>
                    </tr>
                `;
            });
        });
}

/* ==========================
   ADD MEMBER FORM
========================== */
document.getElementById("addMemberForm").addEventListener("submit", e => {
    e.preventDefault();
    const formData = Object.fromEntries(new FormData(e.target));

    fetch("/addMember", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
    }).then(() => {
        e.target.reset();
        loadMembers();
        loadMemberDropdown();
    });
});

/* ==========================
   ADD LOG FORM
========================== */
document.getElementById("addLogForm").addEventListener("submit", e => {
    e.preventDefault();
    const formData = Object.fromEntries(new FormData(e.target));

    fetch("/addLog", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
    }).then(() => {
        e.target.reset();
        loadLogs();
    });
});

/* ==========================
   INITIAL LOAD
========================== */
loadMembers();
loadTasks();
loadLogs();
loadMemberDropdown();
loadTaskDropdown();
</script>

</body>
</html>
